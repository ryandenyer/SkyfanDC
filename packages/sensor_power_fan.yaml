# Estimated fan power based on SkyFan DC datasheet values.
# Uses interpolated 5-speed curves while preserving the original
# maximum power value for each model.

sensor:
  - platform: template
    id: skyfandc_fan_power
    name: "${fan_name} Power"

    update_interval: 30s

    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1

    lambda: |-
      float SKY903[6]  = {0.0, 3.4, 5.7, 10.0, 18.0, 32.0};
      float SKY1203[6] = {0.0, 4.0, 6.4, 12.2, 20.6, 32.5};
      float SKY1303[6] = {0.0, 4.3, 7.1, 13.0, 23.3, 31.8};
      float SKY1503[6] = {0.0, 4.3, 7.2, 13.2, 24.0, 44.2};
      float SKY1204[6] = {0.0, 4.2, 7.1, 13.8, 25.0, 30.0};
      float SKY1404[6] = {0.0, 3.9, 6.5, 12.2, 21.4, 38.0};

      if (!id(skyfandc_fan).state)
        return 0.0f;

      int speed = id(skyfandc_fan).speed;

      if (speed < 0 || speed > 5)
        return 0.0f;

      if ("${fan_model}" == std::string("SKY903"))
        return SKY903[speed];

      if ("${fan_model}" == std::string("SKY1203"))
        return SKY1203[speed];

      if ("${fan_model}" == std::string("SKY1303"))
        return SKY1303[speed];

      if ("${fan_model}" == std::string("SKY1503"))
        return SKY1503[speed];

      if ("${fan_model}" == std::string("SKY1204"))
        return SKY1204[speed];

      if ("${fan_model}" == std::string("SKY1404"))
        return SKY1404[speed];

      return 0.0f;

    disabled_by_default: true