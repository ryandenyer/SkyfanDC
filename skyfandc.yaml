packages:
  skyfan.tuya_fan: !include
    file: tuya_fan.yaml  
  skyfan.tuya_light: !include
    file: tuya_light.yaml  
  skyfan.sensor_ntc: !include
    file: sensor_ntc.yaml 
  skyfan.sensor_tmp117: !include
    file: sensor_tmp117.yaml 
  skyfan.sensor_power_fan: !include
    file: sensor_power_fan.yaml 
  skyfan.sensor_power_light: !include
    file: sensor_power_light.yaml
  skyfan.sensor_rssi: !include
    file: sensor_rssi.yaml

substitutions:
  device_name: skyfandc
  fan_name: "Music Room Fan"
  light_name: "Music Room Light"
  temp_name: "Music Room Temp"
  tmp117_name: "Music Room TMP117"
  skyfan_model: "SKY1203"
  fan_rssi: "Music Room RSSI"

esphome:
  name: ${device_name}
  name_add_mac_suffix: false
  project:
    name: ryandenyer.skyfandc
    version: "2026.09.05"
  on_boot: #Setup temperature reading so you don't get a random reading come through at startup
    priority: -100
    then:
      - switch.turn_on: led
      - delay: 2s
      - switch.turn_off: led

esp8266:
  board: d1_mini

#Dashboard import if you want to adopt the device on your esphome dashboard
dashboard_import:
  package_import_url: github://ryandenyer/SkyfanDC/skyfandc.yaml

logger:
  baud_rate: 0

i2c:
  sda: 4
  scl: 5
  scan: true

api:
  encryption:
    key: !secret easy_skyfandc_ef8941__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  post_connect_roaming: false
  use_address: 192.168.1.173
  
  ap: {}

captive_portal:

uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 9600

tuya:
  id: tuya_mcu

switch:
  - platform: gpio
    pin:
      number: 2
      inverted: true
    id: led