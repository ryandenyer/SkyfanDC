# This exposes a fan entity to the frontend (like Home Assistant).
---
substitutions:
  fan_name: "SkyFan DC Fan"

tuya:
  id: tuya_mcu

  on_datapoint_update:

    # DP2 - Mode
    - sensor_datapoint: 2
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) {
              case 0:
                id(skyfandc_mode).publish_state("Normal");
                break;
              case 1:
                id(skyfandc_mode).publish_state("Eco");
                break;
              case 2:
                id(skyfandc_mode).publish_state("Sleep");
                break;
            }

    # DP22 - Timer
    - sensor_datapoint: 22
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) {
              case 0:  id(skyfandc_timer).publish_state("Off"); break;
              case 1:  id(skyfandc_timer).publish_state("1 Hour"); break;
              case 2:  id(skyfandc_timer).publish_state("2 Hours"); break;
              case 3:  id(skyfandc_timer).publish_state("3 Hours"); break;
              case 4:  id(skyfandc_timer).publish_state("4 Hours"); break;
              case 5:  id(skyfandc_timer).publish_state("5 Hours"); break;
              case 6:  id(skyfandc_timer).publish_state("6 Hours"); break;
              case 7:  id(skyfandc_timer).publish_state("7 Hours"); break;
              case 8:  id(skyfandc_timer).publish_state("8 Hours"); break;
              case 9:  id(skyfandc_timer).publish_state("9 Hours"); break;
              case 10: id(skyfandc_timer).publish_state("10 Hours"); break;
              case 11: id(skyfandc_timer).publish_state("11 Hours"); break;
              case 12: id(skyfandc_timer).publish_state("12 Hours"); break;
            }

fan:
  - platform: tuya
    name: ${fan_name}
    switch_datapoint: 1
    speed_datapoint: 3
    direction_datapoint: 8
    speed_count: 5

select:
  - platform: template
    name: ${fan_name} Mode
    id: skyfandc_mode
    optimistic: false

    options:
      - "Normal"
      - "Eco"
      - "Sleep"

    set_action:
      - lambda: |-
          if (x == "Normal")
            id(tuya_mcu).set_enum_datapoint_value(2, 0);
          else if (x == "Eco")
            id(tuya_mcu).set_enum_datapoint_value(2, 1);
          else if (x == "Sleep")
            id(tuya_mcu).set_enum_datapoint_value(2, 2);

  - platform: template
    name: ${fan_name} Timer
    id: skyfandc_timer
    optimistic: false

    options:
      - "Off"
      - "1 Hour"
      - "2 Hours"
      - "3 Hours"
      - "4 Hours"
      - "5 Hours"
      - "6 Hours"
      - "7 Hours"
      - "8 Hours"
      - "9 Hours"
      - "10 Hours"
      - "11 Hours"
      - "12 Hours"

    set_action:
      - lambda: |-
          if (x == "Off")
            id(tuya_mcu).set_enum_datapoint_value(22, 0);
          else if (x == "1 Hour")
            id(tuya_mcu).set_enum_datapoint_value(22, 1);
          else if (x == "2 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 2);
          else if (x == "3 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 3);
          else if (x == "4 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 4);
          else if (x == "5 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 5);
          else if (x == "6 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 6);
          else if (x == "7 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 7);
          else if (x == "8 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 8);
          else if (x == "9 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 9);
          else if (x == "10 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 10);
          else if (x == "11 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 11);
          else if (x == "12 Hours")
            id(tuya_mcu).set_enum_datapoint_value(22, 12);